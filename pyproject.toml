[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-etl-pipeline"
version = "1.0.0"
description = "Validated, idempotent batch ETL pipeline using Python and SQLite"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
etl-pipeline = "etl_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["etl_pipeline"]

[tool.coverage.report]
show_missing = true
fail_under = 85
